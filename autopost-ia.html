// =================== PIPELINE PRINCIPAL ===================
async function run() {
  const arquivo = ($('transcricaoFile').files || [])[0];
  const textoColado = ((($('transcricaoTexto') || {}).value) || '').trim();
  if (!arquivo && !textoColado) {
    alert('Envie um arquivo de áudio, vídeo ou texto — ou cole um texto.');
    return;
  }

  // Decide a fonte. Prioridade: se há arquivo, ele manda; senão, o texto colado.
  const usarTexto = !arquivo && !!textoColado;            // texto colado na caixa
  const arquivoEhTexto = !!arquivo && ehArquivoDeTexto(arquivo); // arquivo .txt
  const fonteTexto = usarTexto || arquivoEhTexto;          // entrada já é texto (pula transcrição)
  const nomeEntrada = arquivo ? arquivo.name : 'Texto colado';

  const btn = $('generate');
  btn.disabled = true;
  btn.textContent = '⚙ Processando…';
  const out = $('output');

  // Avança o assistente para a etapa 2 (Processar).
  setWizardStep(2);
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const stepsT = [
    { label: fonteTexto ? 'Lendo o conteúdo' : 'Transcrevendo', desc: `${nomeEntrada}${fonteTexto ? ' · texto' : ' · preparando o texto…'}`, state: 'active' },
    { label: 'Montando o pacote', desc: 'Título, legenda, hashtags e palavras-chave', state: '' },
    { label: 'Revisão de qualidade', desc: 'Conferindo cada parte do pacote', state: '' },
    { label: 'Ajuste final', desc: 'Refinamos quando dá para melhorar', state: '' }
  ];

  const aguardeBoxT = `<div class="package" style="opacity:0.6;">
      <div class="package-header">
        <div class="package-title">⚙️ Processando seu conteúdo…</div>
      </div>
      <div class="pkg-section" style="text-align:center; color: var(--ink-faded); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em;">
        Montando seu pacote de publicação · isso pode levar alguns segundos
      </div>
    </div>`;
  const mostraT = (extra = aguardeBoxT) => { out.innerHTML = renderPipeline(stepsT) + extra; };
  mostraT();

  const MAX_ITER = 2; // 1 geração + no máximo 1 refino (juiz reavalia)
  const NOTA_ALVO = 80;

  try {
    // ETAPA 1: OBTER O TEXTO — transcreve mídia OU usa o texto direto (pulando a transcrição).
    let transcricao;
    if (usarTexto) {
      // Texto colado na caixa → vai direto.
      transcricao = textoColado;
      stepsT[0].state = 'done';
      stepsT[0].desc = 'Texto recebido · pulando a transcrição';
      mostraT();
    } else if (arquivoEhTexto) {
      // Arquivo de texto (.txt) → lê o conteúdo, sem transcrição.
      stepsT[0].desc = `${arquivo.name} · lendo o texto…`;
      mostraT();
      transcricao = await lerTextoArquivo(arquivo);
      stepsT[0].state = 'done';
      stepsT[0].desc = `${arquivo.name} · texto carregado`;
      mostraT();
    } else {
      // Áudio/vídeo → otimiza se passar de 25 MB e transcreve (progresso atualiza o passo 0).
      const prep = await otimizarArquivo(arquivo, (msg) => { stepsT[0].desc = msg; mostraT(); });
      if (prep.otimizado) { stepsT[0].desc = `${arquivo.name} · arquivo preparado · transcrevendo…`; mostraT(); }
      transcricao = await transcreverMedia(prep.arquivo, (msg) => { stepsT[0].desc = msg; mostraT(); });
      stepsT[0].state = 'done';
      stepsT[0].desc = `${arquivo.name} · transcrição concluída`;
      mostraT();
    }

    // Garante conteúdo mínimo pra valer a geração.
    transcricao = (transcricao || '').trim();
    if (transcricao.length < 20) {
      throw new Error('O conteúdo está muito curto para gerar um pacote. Envie um áudio/vídeo com fala, ou cole um texto um pouco maior.');
    }

    // Registra o conteúdo no registry pro botão "Copiar"
    const trId = 'tr-' + Date.now();
    window._roteiroRegistry = window._roteiroRegistry || {};
    window._roteiroRegistry[trId] = transcricao;

    const buildTranscBox = () => `<div class="iteration current">
        <div class="iter-header">
          <div>
            <span class="iter-num">${fonteTexto ? 'Texto enviado' : 'Transcrição'}</span>
            ${fonteTexto ? '' : `<span style="color: var(--accent); font-size:10px; margin-left: 10px; font-family: 'JetBrains Mono', monospace; letter-spacing:0.15em;">PORTUGUÊS</span>`}
          </div>
          <div style="display:flex; gap:12px; align-items:center;">
            <button class="copy-btn" data-copy-id="${trId}">Copiar</button>
          </div>
        </div>
        <div class="script-box">${formatRoteiro(transcricao)}</div>
      </div>`;

    // Briefing pra LLM-C: o conteúdo abaixo é a ÚNICA fonte.
    const briefingTransc = {
      theme: fonteTexto
        ? '(o texto enviado abaixo é a única fonte)'
        : '(a transcrição automática do áudio/vídeo abaixo é a única fonte)',
      duration: null, tone: null, niche: '', extra: '(nenhum)', checklist: null
    };
    const contextoJuizT = `Origem do conteúdo: ${fonteTexto ? 'texto enviado diretamente pelo usuário (transcrição, roteiro ou legenda já prontos)' : 'transcrição automática de um áudio/vídeo enviado pelo usuário'}.
O conteúdo abaixo é a ÚNICA fonte — o pacote não deve inventar fatos fora dele:
"""
${transcricao}
"""`;

    // ETAPAS 2-4: GERAR → AVALIAR → REFINAR (entrega sempre a melhor versão)
    let feedback = null;
    let melhor = null;

    for (let i = 1; i <= MAX_ITER; i++) {
      // GERAR (ou refinar)
      stepsT[1].state = 'active';
      stepsT[1].desc = i === 1
        ? 'Título, legenda, hashtags e palavras-chave'
        : 'Refinando o pacote com base na revisão…';
      stepsT[2].state = '';
      mostraT(buildTranscBox());

      const pacote = await gerarPacotePublicacao(transcricao, briefingTransc, feedback);

      // AVALIAR (juiz)
      stepsT[1].state = 'done';
      stepsT[2].state = 'active';
      stepsT[2].desc = 'Conferindo título, legenda, hashtags e palavras-chave…';
      mostraT(buildTranscBox());

      const avaliacao = await avaliarPacote(pacote, contextoJuizT);
      stepsT[2].state = 'done';

      if (!melhor || avaliacao.nota_total > melhor.avaliacao.nota_total) {
        melhor = { pacote, avaliacao };
      }

      if (avaliacao.nota_total >= NOTA_ALVO) {
        stepsT[3].state = 'done';
        stepsT[3].desc = 'Pacote pronto e aprovado na revisão';
        break;
      }

      if (i < MAX_ITER) {
        // Reprovou: monta o feedback dos critérios fracos e refina.
        stepsT[3].state = 'active';
        stepsT[3].desc = 'Dá para melhorar — refinando…';
        const falhas = (avaliacao.avaliacoes || [])
          .filter(a => a.score < 7)
          .map(a => ({ ...a, nome: (RUBRICA_PACOTE.find(r => r.id === a.id) || {}).nome || a.id }));
        feedback = { nota_total: avaliacao.nota_total, falhas, pacoteAnterior: pacote };
        mostraT(buildTranscBox());
      } else {
        // Esgotou as iterações sem atingir a nota: entrega a melhor versão obtida.
        stepsT[3].state = 'done';
        stepsT[3].desc = 'Entregando a melhor versão do pacote';
      }
    }

    const aprovado = melhor.avaliacao.nota_total >= NOTA_ALVO;

    // Auto-save no histórico (biblioteca pessoal) — guarda a versão recém-gerada.
    const agora = new Date().toISOString();
    const histItem = {
      id: 'h-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      criadoEm: agora, atualizadoEm: agora,
      fileName: nomeEntrada,
      fonte: fonteTexto ? 'texto' : 'midia',
      transcricao: transcricao,
      nota: melhor.avaliacao.nota_total,
      aprovado: aprovado,
      veredito: melhor.avaliacao.veredito,
      avaliacoes: melhor.avaliacao.avaliacoes,
      pacote: melhor.pacote,
      editado: false
    };
    const histId = histAdd(histItem);
    updateHistBadge();

    // ETAPA 3 do assistente: pacote pronto (MESMA view do detalhe do histórico).
    setWizardStep(3);
    out.innerHTML = renderPipeline(stepsT) + renderItemDetail(histGet(histId), { context: 'result' });
  } catch (err) {
    stepsT[0].state = '';
    stepsT[0].desc = 'Falha na transcrição ou na geração do pacote.';
    out.innerHTML = renderPipeline(stepsT) +
      `<div class="error-box" style="margin-top:24px;">
        <strong>Não foi possível concluir</strong>
        ${escapeHtml(err && err.message)}
      </div>` +
      `<button type="button" class="btn-reset" data-wizard-reset>← Voltar e tentar outro arquivo</button>`;
  } finally {
    btn.textContent = '⚡ Gerar pacote';
    // O botão fica oculto nas etapas 2/3; é reabilitado pelo resetWizard ao voltar à etapa 1.
  }
}

// Controla o assistente em 3 etapas (1 Enviar · 2 Processar · 3 Pacote).
function setWizardStep(n) {
  document.querySelectorAll('#stepper .step-node').forEach(node => {
    const s = parseInt(node.dataset.step, 10);
    node.classList.toggle('active', s === n);
    node.classList.toggle('done', s < n);
  });
  const upload = $('screen-upload');
  const result = $('screen-result');
  if (upload) upload.style.display = (n === 1) ? '' : 'none';
  if (result) result.style.display = (n === 1) ? 'none' : '';
}

// Volta ao início: limpa o arquivo/preview e mostra a etapa 1 (Enviar).
function resetWizard() {
  const fileInput = $('transcricaoFile');
  if (fileInput) fileInput.value = '';
  const textArea = $('transcricaoTexto');
  if (textArea) textArea.value = '';
  const out = $('output');
  if (out) out.innerHTML = '';
  const btn = $('generate');
  if (btn) { btn.disabled = true; btn.textContent = '⚡ Gerar pacote'; }
  // Restaura os estados visuais da caixa única (digitação visível, chip oculto, ✕ escondido).
  if (window._refletirEntrada) window._refletirEntrada();
  setWizardStep(1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('generate').addEventListener('click', run);

// =================== TRANSCRIÇÃO (Groq Whisper, pt-BR) ===================
// Transcreve um arquivo de áudio/vídeo enviando-o à API de transcrição da Groq
// (Whisper large v3, OpenAI-compatível). Lê o arquivo DIRETO — sem microfone e
// sem tocar o áudio. Precisa de internet e consome cota da Groq.
//   • acurácia alta (~98%), pt-BR nativo;
//   • limite de ~25 MB por arquivo (free tier da Groq);
//   • aceita áudio (MP3, WAV, M4A, FLAC, OGG…) e vídeo com trilha (MP4, WebM…).
// Reaproveita a mesma resolução de chave do callLLM (getGroqKey + localStorage).
// onProgress(msg) é um callback opcional pra atualizar o status na tela.
const GROQ_WHISPER_ENDPOINT = "https://api.groq.com/openai/v1/audio/transcriptions";
const GROQ_WHISPER_MODEL = "whisper-large-v3";
const WHISPER_MAX_BYTES = 25 * 1024 * 1024; // limite do free tier da Groq

// =================== OTIMIZAÇÃO AUTOMÁTICA DE ARQUIVOS GRANDES (100% no navegador) ===================
// Se o arquivo passa de 25 MB, extraímos/comprimimos o áudio pra 16 kHz mono (MP3) ANTES de enviar pra
// Groq, usando só APIs nativas do navegador (Web Audio) + um encoder MP3 puro-JS (lamejs, embutido inline
// acima). SEM servidor, SEM CDN, SEM worker, SEM wasm → funciona abrindo o arquivo direto (file://).
// A Groq já reamostra pra 16 kHz mono no servidor, então isto é só REDUÇÃO DE TAMANHO, sem perda extra.
const WHISPER_SAFE_BYTES = 23 * 1024 * 1024; // alvo com margem sob o limite de 25 MB

// Decodifica o arquivo (áudio nativo OU a faixa de áudio de vídeos que o navegador saiba decodificar).
// Lê o arquivo como ArrayBuffer, com fallback FileReader p/ navegadores móveis antigos sem Blob.arrayBuffer().
function lerArrayBuffer(arquivo) {
  if (arquivo.arrayBuffer) return arquivo.arrayBuffer();
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error || new Error('Falha ao ler o arquivo.'));
    fr.readAsArrayBuffer(arquivo);
  });
}

// O arquivo é de TEXTO? (tipo text/* ou extensão .txt/.md/.markdown/.text)
function ehArquivoDeTexto(arquivo) {
  if (!arquivo) return false;
  if (/^text\//i.test(arquivo.type || '')) return true;
  return /\.(txt|md|markdown|text)$/i.test(arquivo.name || '');
}

// Lê o arquivo como texto (UTF-8), com fallback FileReader p/ navegadores sem Blob.text().
function lerTextoArquivo(arquivo) {
  if (arquivo.text) return arquivo.text();
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ''));
    fr.onerror = () => reject(fr.error || new Error('Falha ao ler o arquivo de texto.'));
    fr.readAsText(arquivo, 'utf-8');
  });
}

async function decodificarAudio(arquivo) {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error('Seu navegador não suporta Web Audio (AudioContext).');
  // IMPORTANTE p/ mobile (iOS Safari / Chrome Android): criar e retomar o AudioContext ainda
  // dentro do gesto do usuário — ANTES de qualquer await — senão ele fica "suspended" e falha.
  const ctx = new AC();
  try {
    if (ctx.state === 'suspended' && ctx.resume) { try { await ctx.resume(); } catch (_) {} }
    const ab = await lerArrayBuffer(arquivo);
    return await new Promise((resolve, reject) => {
      // forma com callbacks (compat. ampla) + também resolve se vier Promise (navegadores modernos)
      let p;
      try { p = ctx.decodeAudioData(ab, resolve, reject); } catch (e) { reject(e); return; }
      if (p && typeof p.then === 'function') p.then(resolve, reject);
    });
  } finally {
    if (ctx.close) { try { ctx.close(); } catch (_) {} }
  }
}

// Reamostra um AudioBuffer pra 16 kHz MONO e devolve um Float32Array (PCM).
async function paraMono16k(audioBuf) {
  const TAXA = 16000;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) throw new Error('Seu navegador não suporta OfflineAudioContext.');
  const frames = Math.max(1, Math.ceil(audioBuf.duration * TAXA));
  const off = new OAC(1, frames, TAXA);
  const src = off.createBufferSource();
  src.buffer = audioBuf;
  src.connect(off.destination); // 1 canal no destino → downmix automático pra mono
  src.start(0);
  const rendered = await off.startRendering();
  return rendered.getChannelData(0); // Float32 @ 16 kHz mono
}

// Otimiza o arquivo se passar do limite seguro. Retorna { arquivo, otimizado, de, para }.
async function otimizarArquivo(arquivo, onProgress) {
  if (!arquivo) throw new Error('Nenhum arquivo selecionado.');
  if (arquivo.size <= WHISPER_SAFE_BYTES) return { arquivo, otimizado: false, de: arquivo.size, para: arquivo.size };

  if (typeof lamejs === 'undefined' || !lamejs.Mp3Encoder) {
    throw new Error('O compactador de áudio (embutido) não carregou. Recarregue a página e tente de novo.');
  }

  // 1) decodifica (áudio, ou a faixa de áudio de um vídeo suportado pelo navegador)
  if (onProgress) onProgress('Lendo o áudio…');
  let audioBuf;
  try {
    audioBuf = await decodificarAudio(arquivo);
  } catch (e) {
    throw new Error('Não foi possível abrir este arquivo. Tente um formato comum de áudio (MP3, M4A, WAV) ou de vídeo (MP4, MOV, WebM).');
  }
  const dur = audioBuf.duration || 0;

  // 2) reamostra p/ 16 kHz mono
  if (onProgress) onProgress('Preparando o áudio…');
  const f32 = await paraMono16k(audioBuf);
  audioBuf = null; // libera o PCM grande
  const n = f32.length;

  // 3) Float32 [-1,1] -> Int16
  const i16 = new Int16Array(n);
  for (let i = 0; i < n; i++) { const s = f32[i] < -1 ? -1 : (f32[i] > 1 ? 1 : f32[i]); i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF; }

  // 4) bitrate alvo pra caber em WHISPER_SAFE_BYTES (16..64 kbps; sem duração → 48)
  const segundos = dur || (n / 16000);
  let kbps = segundos ? Math.floor((WHISPER_SAFE_BYTES * 8) / (segundos * 1000)) : 48;
  kbps = Math.max(16, Math.min(64, kbps));

  // 5) encoda MP3 em blocos, cedendo o controle pra UI não travar + progresso
  if (onProgress) onProgress('Preparando o arquivo…');
  const enc = new lamejs.Mp3Encoder(1, 16000, kbps);
  const BLOCO = 1152 * 100; // ~115k amostras por passo
  const partes = [];
  let passo = 0;
  for (let i = 0; i < n; i += BLOCO) {
    const buf = enc.encodeBuffer(i16.subarray(i, Math.min(n, i + BLOCO)));
    if (buf.length) partes.push(new Uint8Array(buf));
    if (onProgress) onProgress('Preparando o arquivo… ' + Math.min(100, Math.round(((i + BLOCO) / n) * 100)) + '%');
    if ((++passo % 4) === 0) await new Promise(r => setTimeout(r, 0)); // cede o controle pra UI respirar
  }
  const fim = enc.flush();
  if (fim && fim.length) partes.push(new Uint8Array(fim));

  const baseNome = ((arquivo.name || 'audio').replace(/\.[^.]+$/, '')) || 'audio';
  const saida = new File(partes, baseNome + '.mp3', { type: 'audio/mpeg' });

  if (saida.size > WHISPER_MAX_BYTES) {
    throw new Error('Este conteúdo é muito longo para transcrever de uma vez. Tente dividi-lo em partes menores.');
  }
  return { arquivo: saida, otimizado: true, de: arquivo.size, para: saida.size };
}


async function transcreverMedia(arquivo, onProgress) {
  if (!arquivo) throw new Error('Nenhum arquivo selecionado.');
  if (arquivo.size > WHISPER_MAX_BYTES) {
    throw new Error('Não foi possível preparar este arquivo automaticamente. Ele parece muito longo — tente dividi-lo em partes menores.');
  }

  const apiKey = getGroqKey();
  if (!apiKey) throw new Error('Não foi possível iniciar a transcrição. Recarregue a página e tente novamente.');

  if (onProgress) onProgress('Enviando o arquivo para transcrição…');

  // multipart/form-data — NÃO definimos Content-Type à mão (o browser põe o boundary).
  const form = new FormData();
  form.append('file', arquivo, arquivo.name || 'audio');
  form.append('model', GROQ_WHISPER_MODEL);
  form.append('language', 'pt');
  form.append('response_format', 'json');
  form.append('temperature', '0');

  const MAX_RETRIES = 4;
  for (let attempt = 0; ; attempt++) {
    let response;
    try {
      response = await fetch(GROQ_WHISPER_ENDPOINT, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + apiKey },
        body: form
      });
    } catch (netErr) {
      throw new Error('Falha de conexão ao enviar o áudio. Verifique sua internet e tente novamente.');
    }

    // 429 (limite de taxa) / 503: respeita Retry-After e tenta de novo com backoff.
    if ((response.status === 429 || response.status === 503) && attempt < MAX_RETRIES) {
      const retryAfter = parseFloat(response.headers.get('retry-after'));
      const wait = Number.isFinite(retryAfter) && retryAfter > 0
        ? retryAfter * 1000
        : Math.min(1500 * Math.pow(2, attempt), 20000);
      if (onProgress) onProgress('Muitas solicitações no momento — aguardando ' + Math.round(wait / 1000) + 's…');
      await new Promise(r => setTimeout(r, wait));
      continue;
    }

    if (!response.ok) {
      const txt = await response.text();
      if (response.status === 401) throw new Error('Não foi possível autenticar a transcrição. Recarregue a página e tente novamente.');
      if (response.status === 413) throw new Error('O arquivo ficou grande demais para transcrever. Tente dividi-lo em partes menores.');
      throw new Error('Não foi possível concluir a transcrição agora. Tente novamente em instantes.');
    }

    if (onProgress) onProgress('Processando a transcrição…');
    const data = await response.json();
    const texto = ((data && data.text) || '').trim();
    if (!texto) throw new Error('Não encontramos fala neste arquivo. Verifique se há áudio audível e tente outro.');
    return texto;
  }
}

// ---- Etapa 1: preview do arquivo, habilitar o botão e arraste-e-solte ----
(function () {
  const fileInput = $('transcricaoFile');
  const preview   = $('transcricaoPreview');
  const nameEl    = $('transcricaoFileName');
  const sizeEl    = $('transcricaoFileSize');
  const clearBtn  = $('transcricaoClearBtn');
  const smartbox  = $('smartbox');
  const toolbar   = $('sbToolbar');
  const textClearBtn = $('textClearBtn');
  const textArea  = $('transcricaoTexto');
  const genBtn    = $('generate');
  if (!fileInput || !preview) return;

  const fmtBytes = (b) => {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1024 / 1024).toFixed(2) + ' MB';
  };

  // Atualiza os estados da caixa única: arquivo anexado (chip) × área de digitação; e o botão.
  const refletir = () => {
    const f = (fileInput.files || [])[0];
    if (f) {
      // ARQUIVO anexado → mostra o chip dentro da caixa, esconde a digitação.
      nameEl.textContent = f.name;
      const ehTxt = ehArquivoDeTexto(f);
      const tipo = ehTxt ? 'texto' : (f.type || 'arquivo');
      const grande = !ehTxt && f.size > WHISPER_MAX_BYTES;
      sizeEl.innerHTML = escapeHtml(tipo) + ' · ' + fmtBytes(f.size) +
        (grande ? ' · <span style="color:var(--accent);">será preparado automaticamente</span>' : '');
      preview.style.display = 'flex';
      if (textArea) textArea.style.display = 'none';
      if (toolbar) toolbar.style.display = 'none';
      if (textClearBtn) textClearBtn.style.display = 'none';
    } else {
      // SEM arquivo → área de digitação visível; ✕ aparece quando há texto.
      preview.style.display = 'none';
      if (textArea) textArea.style.display = '';
      if (toolbar) toolbar.style.display = '';
      const temTxt = !!(textArea && textArea.value.trim());
      if (textClearBtn) textClearBtn.style.display = temTxt ? 'flex' : 'none';
    }
    const temTexto = !!(textArea && textArea.value.trim());
    if (genBtn) genBtn.disabled = !(f || temTexto);
  };

  // Texto e arquivo são alternativas: escolher um limpa o outro.
  fileInput.addEventListener('change', () => {
    if ((fileInput.files || []).length && textArea) textArea.value = '';
    refletir();
  });
  if (textArea) textArea.addEventListener('input', () => {
    if (textArea.value.trim() && (fileInput.files || []).length) fileInput.value = '';
    refletir();
  });

  // ✕ limpar o texto (canto superior da caixa).
  if (textClearBtn) {
    textClearBtn.addEventListener('click', () => {
      if (textArea) { textArea.value = ''; textArea.focus(); }
      refletir();
    });
  }

  // ✕ remover o arquivo anexado (no chip).
  if (clearBtn) {
    clearBtn.addEventListener('click', (e) => {
      e.preventDefault();
      fileInput.value = '';
      refletir();
    });
  }

  // Arraste-e-solte sobre a caixa inteira.
  if (smartbox) {
    ['dragenter', 'dragover'].forEach(ev =>
      smartbox.addEventListener(ev, (e) => { e.preventDefault(); smartbox.classList.add('dragover'); }));
    ['dragleave', 'dragend', 'drop'].forEach(ev =>
      smartbox.addEventListener(ev, (e) => { e.preventDefault(); smartbox.classList.remove('dragover'); }));
    smartbox.addEventListener('drop', (e) => {
      const arquivos = e.dataTransfer && e.dataTransfer.files;
      if (arquivos && arquivos.length) {
        try {
          const dt = new DataTransfer();
          dt.items.add(arquivos[0]);
          fileInput.files = dt.files;
          if (textArea) textArea.value = '';
        } catch (_) {
          // Navegadores sem DataTransfer construtível: o botão "Anexar arquivo" ainda funciona.
        }
        refletir();
      }
    });
  }

  // Expõe pro resetWizard reaproveitar a mesma lógica de estado.
  window._refletirEntrada = refletir;

  // Estado inicial.
  refletir();
})();

// Começa o assistente na etapa 1 (Enviar) e mostra a contagem do histórico.
setWizardStep(1);
updateHistBadge();
histHydrate();  // carrega o histórico do IndexedDB (capacidade = dispositivo)
</script>
