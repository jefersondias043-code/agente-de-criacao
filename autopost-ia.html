<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoPost IA · Áudio/Vídeo → Pacote de Publicação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&family=JetBrains+Mono:wght@400;500;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --bg-card: #181818;
    --ink: #f5f1e8;
    --ink-dim: #a8a39a;
    --ink-faded: #6b6760;
    --accent: #ff5b1f;
    --accent-glow: #ff5b1f33;
    --line: #2a2824;
    --pass: #7fb069;
    --pass-bg: #1a2a1a;
    --fail: #d64545;
    --fail-bg: #2a1414;
    --warn: #ffb800;
    --warn-bg: #2a2008;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    min-height: 100vh;
    background-image:
      radial-gradient(at 10% 0%, #1f140d 0%, transparent 40%),
      radial-gradient(at 90% 100%, #0d1418 0%, transparent 45%);
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

  /* HEADER */
  header { margin-bottom: 40px; }
  /* ===== CABEÇALHO / MARCA (logo + nome + slogan) ===== */
  header.brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
  }
  .brand-logo svg {
    width: 46px; height: 46px; display: block;
    filter: drop-shadow(0 4px 14px rgba(255, 91, 31, 0.28));
  }
  .brand-text { min-width: 0; }
  .brand-name {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-weight: 800;
    font-size: 29px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
  }
  .brand-name .ia { color: var(--accent); }
  .brand-slogan {
    margin-top: 8px;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 14px;
    letter-spacing: 0.005em;
    color: var(--ink-dim);
  }

  /* INPUT PANEL */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px;
  }
  .panel-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .field .hint {
    font-size: 11px;
    color: var(--ink-faded);
    margin-bottom: 8px;
  }
  input, select, textarea {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 11px 14px;
    border-radius: 5px;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 14px;
    transition: border 0.2s;
  }
  textarea { min-height: 88px; resize: vertical; font-family: inherit; line-height: 1.5; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    padding: 14px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .btn:hover:not(:disabled) {
    background: #ff6f3a;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px -8px var(--accent);
  }
  .btn:disabled {
    background: var(--line);
    color: var(--ink-faded);
    cursor: not-allowed;
  }

  /* OUTPUT */
  .output-panel { min-height: 400px; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-faded);
  }
  .empty-state .icon {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 64px;
    color: var(--line);
    margin-bottom: 16px;
    line-height: 1;
  }
  .empty-state .text { font-size: 14px; max-width: 320px; margin: 0 auto; }

  /* PIPELINE STATUS */
  .pipeline {
    margin-bottom: 24px;
    padding: 18px;
    background: var(--bg-elev);
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .pipeline-step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    font-size: 13px;
    color: var(--ink-dim);
    transition: color 0.3s;
  }
  .pipeline-step.active { color: var(--accent); }
  .pipeline-step.done { color: var(--pass); }
  .pipeline-step .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .pipeline-step.active .dot {
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
    animation: pulse 1.2s ease infinite;
  }
  .pipeline-step.done .dot { background: var(--pass); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .pipeline-step .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .pipeline-step .desc { color: var(--ink-faded); font-size: 12px; }

  /* ITERATION */
  .iteration {
    margin-bottom: 20px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .iteration.current { border-color: var(--accent); }
  .iter-header {
    padding: 14px 18px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .iter-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .iter-score {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .iter-score.pass { color: var(--pass); }
  .iter-score.warn { color: var(--warn); }
  .iter-score.fail { color: var(--fail); }
  .iter-score .max { font-size: 14px; color: var(--ink-faded); font-weight: 400; }

  .script-box {
    padding: 20px 22px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .script-box .seg {
    display: block;
    margin-bottom: 14px;
  }
  .script-box .seg-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
    display: block;
  }

  .eval-box {
    border-top: 1px solid var(--line);
    padding: 16px 22px;
    background: #0d0d0d;
  }
  .eval-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 12px;
  }
  .criterion {
    padding: 8px 0;
    border-bottom: 1px solid #1f1d1a;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .criterion:last-child { border: none; }
  .crit-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    flex-shrink: 0;
    min-width: 38px;
    text-align: center;
  }
  .crit-score.pass { background: var(--pass-bg); color: var(--pass); }
  .crit-score.warn { background: var(--warn-bg); color: var(--warn); }
  .crit-score.fail { background: var(--fail-bg); color: var(--fail); }
  .crit-body { flex: 1; }
  .crit-name { font-size: 13px; color: var(--ink); margin-bottom: 2px; font-weight: 500; }
  .crit-feedback { font-size: 12px; color: var(--ink-dim); line-height: 1.45; }

  .toggle-eval {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .toggle-eval:hover { border-color: var(--accent); color: var(--accent); }

  .eval-collapsed { display: none; }

  .error-box {
    background: var(--fail-bg);
    border: 1px solid var(--fail);
    color: var(--ink);
    padding: 16px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .error-box strong { color: var(--fail); display: block; margin-bottom: 4px; }

  .final-banner {
    padding: 18px 22px;
    background: linear-gradient(90deg, #0f1a0c, var(--bg-card));
    border-left: 3px solid var(--pass);
    border-radius: 0 6px 6px 0;
    margin-bottom: 20px;
  }
  .final-banner.warn {
    background: linear-gradient(90deg, #1a1408, var(--bg-card));
    border-left-color: var(--warn);
  }
  .final-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--pass);
    margin-bottom: 6px;
  }
  .final-banner.warn .final-label { color: var(--warn); }
  .final-text { font-size: 13.5px; color: var(--ink); }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.acc { color: var(--accent); border-color: rgba(255,91,31,0.45); }
  .copy-btn.acc:hover { border-color: var(--accent); background: rgba(255,91,31,0.08); }

  .field-group { display: contents; }
  .field-group.hidden { display: none !important; }
  .field-group.hidden * { display: none !important; }

  /* ========== PACOTE DE PUBLICAÇÃO ========== */
  .package {
    margin-top: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .package-header {
    padding: 16px 22px;
    background: linear-gradient(90deg, #1a1208, var(--bg-card));
    border-bottom: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .package-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .copy-all-btn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-all-btn:hover { background: #ff6f3a; transform: translateY(-1px); }

  .pkg-section {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }
  .pkg-section:last-child { border-bottom: none; }
  .pkg-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 12px;
  }
  .pkg-label-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .pkg-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.05em;
  }
  .pkg-content {
    background: #0d0d0d;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 14px 16px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
  }
  .pkg-content.titulo {
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  .pkg-content.legenda {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .hashtags-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hashtag-chip {
    background: #0d0d0d;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: default;
  }
  .hashtag-chip .tag-type {
    font-size: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 2px 6px;
    background: var(--accent-glow);
    border-radius: 3px;
    font-weight: 700;
  }
  .hashtags-string {
    background: #0d0d0d;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    margin-top: 10px;
    word-break: break-word;
  }

  /* ========== PALAVRAS-CHAVE (PACOTE) ========== */
  .keywords-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .keyword-chip {
    background: #0d0d0d;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    cursor: default;
  }
  .keywords-string {
    background: #0d0d0d;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 10px;
    word-break: break-word;
  }

  /* ===== WIZARD (fluxo único: áudio/vídeo → pacote) ===== */
  .wizard { max-width: 720px; margin: 36px auto 0; }

  .stepper {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    padding: 0;
  }
  .step-node {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--ink-faded);
    transition: color 0.3s;
  }
  .step-dot {
    width: 26px; height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700;
    background: var(--bg-elev);
    transition: all 0.3s;
  }
  .step-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .step-bar { flex: 1; height: 1px; background: var(--line); }
  .step-node.active { color: var(--accent); }
  .step-node.active .step-dot {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }
  .step-node.done { color: var(--pass); }
  .step-node.done .step-dot {
    border-color: var(--pass);
    background: var(--pass);
    color: #0a0a0a;
  }
  @media (max-width: 520px) {
    .step-label { display: none; }
  }

  /* ===== CAIXA ÚNICA DE ENTRADA (texto + arquivo, num só componente) ===== */
  .smartbox {
    position: relative;
    margin-bottom: 16px;
    background: var(--bg-elev);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
  }
  .smartbox:focus-within { border-color: var(--accent); }
  .smartbox.dragover { border-color: var(--accent); background: #17120e; }
  .smartbox textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 0;
    resize: vertical;
    min-height: 148px;
    padding: 16px 42px 16px 16px;   /* espaço à direita pro ✕ */
    color: var(--ink);
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    display: block;
  }
  .smartbox textarea:focus { outline: none; box-shadow: none; }
  .smartbox textarea::placeholder { color: var(--ink-faded); }
  /* ✕ discreto pra limpar o texto (canto superior direito da caixa) */
  .sb-clear {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-card); border: 1px solid var(--line);
    color: var(--ink-faded); border-radius: 6px; cursor: pointer;
    font-size: 11px; line-height: 1;
    transition: color 0.15s, border-color 0.15s;
  }
  .sb-clear:hover { color: var(--ink); border-color: var(--ink-faded); }
  /* rodapé da caixa: botão de anexar + dica */
  .sb-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    background: var(--bg-card);
  }
  .sb-attach {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 7px;
    padding: 8px 12px; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .sb-attach:hover { color: var(--ink); border-color: var(--accent); background: var(--bg-elev); }
  .sb-hint {
    color: var(--ink-faded); font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.05em; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* chip do arquivo anexado, exibido dentro da caixa */
  .sb-file { display: flex; align-items: center; gap: 12px; padding: 16px; }
  .sb-file-icon { font-size: 22px; flex-shrink: 0; }
  .sb-file-meta { min-width: 0; flex: 1; }
  .sb-file-name { color: var(--ink); font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-file-sub { color: var(--ink-faded); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em; margin-top: 3px; }
  .sb-file-remove {
    flex-shrink: 0; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line);
    color: var(--ink-faded); border-radius: 6px; cursor: pointer; font-size: 12px;
    transition: color 0.15s, border-color 0.15s;
  }
  .sb-file-remove:hover { color: var(--fail); border-color: var(--fail); }

  /* BOTÃO RECOMEÇAR */
  .btn-reset {
    display: inline-block;
    margin-top: 24px;
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    padding: 11px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 5px; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }
  .btn-reset.btn-danger:hover { border-color: var(--fail); color: var(--fail); }

  /* ===== ABAS (Nova transcrição / Histórico) ===== */
  .tabs {
    display: flex;
    gap: 8px;
    margin: 0 0 28px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-dim);
    padding: 12px 6px;
    margin-bottom: -1px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    display: flex; align-items: center; gap: 8px;
  }

<script>
/* Ponte de configuração com o app principal (Agente) — funciona em file:// e em servidor.
   Recebe chave+modelo via postMessage e guarda em window.__AGENTE_CONFIG__ + localStorage. */
(function(){
  function applyCfg(c){
    if(!c) return;
    window.__AGENTE_CONFIG__ = { groqKey: c.groqKey||"", groqModel: c.groqModel||"", locked: !!c.locked };
    try {
      /* Workspace bloqueado: NÃO persiste a chave (fica só em memória). */
      if(c.groqKey && !c.locked){ localStorage.setItem("groq_api_key", c.groqKey); localStorage.setItem("df_groq_key", c.groqKey); }
      if(c.groqModel){ localStorage.setItem("groq_model", c.groqModel); localStorage.setItem("df_model", c.groqModel); }
    } catch(_){}
  }
  function applyContent(d){ try{ var ta=document.getElementById("transcricaoTexto"); if(ta){ ta.value=d.text||""; ta.dispatchEvent(new Event("input",{bubbles:true})); ta.focus(); ta.scrollIntoView({behavior:"smooth",block:"center"}); } }catch(_){} }
  /* Segurança: só aceita comandos da janela PAI (o app); ignora outras fontes. */
  window.addEventListener("message", function(e){ if(!e||!e.data||e.source!==window.parent) return; if(e.data.type==="agente:config") applyCfg(e.data); if(e.data.type==="agente:content") applyContent(e.data); });
  try { if(window.parent && window.parent!==window) window.parent.postMessage({type:"agente:config-request"}, location.protocol==="file:"?"*":location.origin); } catch(_){}
})();
/* Saída: injeta "Enviar para…" que DEVOLVE o conteúdo ao app pai (Cartaz/Gerar/
   Detector) em DOIS lugares — no PACOTE gerado e no card da TRANSCRIÇÃO.
   Aditivo (MutationObserver), não edita o render do AutoPost. */
(function(){
  function makeBar(getText, marker){
    var bar=document.createElement("div");
    bar.className=marker;
    bar.style.cssText="display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:14px 22px;border-top:1px solid var(--line);";
    var lab=document.createElement("span");
    lab.textContent="Enviar para";
    lab.style.cssText="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faded);font-family:'JetBrains Mono',monospace;font-weight:700;";
    bar.appendChild(lab);
    [["cartazes","Cartaz"],["carrossel","Carrossel"],["generate","Gerar matéria"],["replicador","Replicador"],["detector","Detector"],["reescrita","Reescrever"]].forEach(function(d){
      var b=document.createElement("button"); b.type="button"; b.className="copy-btn"; b.textContent=d[1]+" →";
      b.addEventListener("click",function(){ try{ window.parent.postMessage({type:"agente:content-out",target:d[0],text:getText()}, location.protocol==="file:"?"*":location.origin); }catch(_){} });
      bar.appendChild(b);
    });
    return bar;
  }
  function pkgText(p){
    var t=p.querySelector(".pkg-content.titulo"), l=p.querySelector(".pkg-content.legenda");
    return [t&&t.textContent.trim(), l&&l.textContent.trim()].filter(Boolean).join("\n\n");
  }
  function injectPkg(p){ if(p.querySelector(".agente-out")) return; p.appendChild(makeBar(function(){return pkgText(p);}, "agente-out")); }
  function injectTr(it){
    if(it.querySelector(".agente-out-tr")) return;
    var sb=it.querySelector(".script-box"); if(!sb) return; // só a transcrição tem .script-box
    it.appendChild(makeBar(function(){return (sb.textContent||"").trim();}, "agente-out-tr"));
  }
  try{
    var obs=new MutationObserver(function(){
      document.querySelectorAll(".package").forEach(injectPkg);
      document.querySelectorAll(".transc-wrap .iteration.current").forEach(injectTr);
    });
    obs.observe(document.documentElement,{childList:true,subtree:true});
  }catch(_){}
})();
/* Entrada UNIFICADA: um único botão "Anexar arquivo" que aceita TODOS os formatos.
   O botão nativo do AutoPost é ocultado. Roteamento por tipo: áudio/vídeo seguem
   pelo pipeline nativo (transcrição + chunking); PDF/imagem/DOCX/TXT vão ao app
   pai (OCR/extração via agente:ingest). Aditivo — não altera o render do AutoPost. */
(function(){
  var pending={};
  window.addEventListener("message", function(e){
    if(!e||e.source!==window.parent) return;
    var d=e.data; if(!d||!d.reqId) return;
    var cb=pending[d.reqId]; if(!cb) return;
    if(d.type==="agente:ingest-progress"){ cb.status.textContent=d.msg||"Processando…"; }
    else if(d.type==="agente:ingest-result"){
      var t=cb.target, cur=(t.value||"").trim();
      t.value = cur ? (cur+"\n\n"+(d.text||"")) : (d.text||"");
      t.dispatchEvent(new Event("input",{bubbles:true}));
      cb.status.textContent="Texto extraído e adicionado.";
      setTimeout(function(){ cb.status.textContent=""; }, 2500);
      delete pending[d.reqId];
    } else if(d.type==="agente:ingest-error"){
      cb.status.textContent=d.error||"Não foi possível processar o arquivo.";
      delete pending[d.reqId];
    }
  });
  function inject(){
    var sb=document.getElementById("smartbox"); var ta=document.getElementById("transcricaoTexto");
    if(!sb||!ta||!sb.parentNode) return;
    // Botao UNIFICADO de entrada: esconde o "Anexar arquivo" nativo para deixar
    // UM unico botao (como nas outras ferramentas). O input nativo continua no DOM
    // (oculto) e e reaproveitado para rotear audio/video ao pipeline do AutoPost.
    var natLbl=document.querySelector('label.sb-attach[for="transcricaoFile"]');
    if(natLbl) natLbl.style.display="none";
    if(sb.parentNode.querySelector(".agente-attach")) return;
    var nat=document.getElementById("transcricaoFile");
    var wrap=document.createElement("div"); wrap.className="agente-attach";
    wrap.style.cssText="margin:10px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;";
    var inp=document.createElement("input"); inp.type="file"; inp.style.display="none";
    // Aceita TODOS os formatos do ecossistema (mesma lista do "Extrair").
    inp.accept=".txt,.md,.pdf,.docx,.png,.jpg,.jpeg,.bmp,.gif,.webp,.tiff,.tif,.mp3,.wav,.m4a,.ogg,.flac,.aac,.mp4,.mpeg,.mpga,.webm,.mov,.3gp,text/plain,application/pdf,image/*,audio/*,video/*";
    var btn=document.createElement("button"); btn.type="button"; btn.className="copy-btn";
    btn.style.cssText="display:inline-flex;align-items:center;gap:6px;";
    btn.textContent="📎 Anexar arquivo";
    var hint=document.createElement("span"); hint.style.cssText="font-size:11.5px;color:var(--ink-faded);";
    var HINT_DEFAULT="áudio, vídeo, PDF, imagem ou texto"; hint.textContent=HINT_DEFAULT;
    var status=document.createElement("span"); status.style.cssText="font-size:11.5px;color:var(--ink-faded);";
    btn.onclick=function(){ inp.click(); };
    function sendToParent(f){
      var reqId="ing-"+Date.now()+"-"+Math.random().toString(16).slice(2);
      pending[reqId]={target:ta,status:status}; status.textContent="Processando…";
      try{ window.parent.postMessage({type:"agente:ingest",reqId:reqId,file:f}, location.protocol==="file:"?"*":location.origin); }
      catch(_){ status.textContent="Não foi possível enviar o arquivo."; delete pending[reqId]; }
    }
    inp.onchange=function(){
      var f=inp.files&&inp.files[0]; if(!f){ return; }
      var nm=(f.name||"").toLowerCase();
      var isMedia=/^audio\//.test(f.type)||/^video\//.test(f.type)||/\.(mp3|wav|m4a|ogg|flac|aac|mp4|mpeg|mpga|webm|mov|3gp)$/.test(nm);
      if(isMedia && nat){
        // Audio/video -> pipeline NATIVO do AutoPost (transcricao + chunking p/ arquivos grandes).
        try{
          var dt=new DataTransfer(); dt.items.add(f); nat.files=dt.files;
          nat.dispatchEvent(new Event("change",{bubbles:true}));
          status.textContent="Mídia adicionada para transcrição.";
          setTimeout(function(){ status.textContent=""; }, 2500);
        }catch(_){ sendToParent(f); }
      } else {
        // PDF, imagem, DOCX, TXT... -> extracao/OCR/transcricao no app pai (universal).
        sendToParent(f);
      }
      inp.value="";
    };
    wrap.appendChild(inp); wrap.appendChild(btn); wrap.appendChild(hint); wrap.appendChild(status);
    sb.parentNode.insertBefore(wrap, sb.nextSibling);
  }
  try{ var obs2=new MutationObserver(inject); obs2.observe(document.documentElement,{childList:true,subtree:true}); }catch(_){}
  setTimeout(inject, 300);
})();
/* Mobile: o pacote gerado renderiza ABAIXO da transcrição — rola até o
   primeiro pacote NOVO quando ele aparece (só em telas estreitas). */
(function(){
  if (!window.matchMedia) return;
  var mq = window.matchMedia("(max-width: 880px)");
  function markAll(){ document.querySelectorAll(".package").forEach(function(p){ p.setAttribute("data-agente-seen","1"); }); }
  function check(){
    var fresh = document.querySelectorAll(".package:not([data-agente-seen])");
    if (!fresh.length) return;
    fresh.forEach(function(p){ p.setAttribute("data-agente-seen","1"); });
    if (mq.matches) { try { fresh[0].scrollIntoView({ behavior: "smooth", block: "start" }); } catch(_) {} }
  }
  setTimeout(function(){
    markAll(); /* pacotes restaurados do armazenamento não disparam scroll */
    try { new MutationObserver(check).observe(document.documentElement, { childList: true, subtree: true }); } catch(_) {}
  }, 800);
})();
</script>

    <ol class="stepper" id="stepper">

      <div class="smartbox" id="smartbox">
        <input type="file" id="transcricaoFile" accept="audio/*,video/*,text/plain,.txt,.md" hidden />

        <div id="transcricaoPreview" class="sb-file" style="display:none;">

          <div class="sb-file-meta">

            <div id="transcricaoFileSize" class="sb-file-sub"></div>
          </div>
          <button type="button" id="transcricaoClearBtn" class="sb-file-remove" title="Remover arquivo" aria-label="Remover arquivo">✕</button>
        </div>

        <!-- rodapé: anexar arquivo + dica de arrastar -->
        <div class="sb-toolbar" id="sbToolbar">
          <label class="sb-attach" for="transcricaoFile">📎 Anexar arquivo</label>
          <span class="sb-hint">ou arraste aqui · áudio, vídeo ou .txt</span>
        </div>
      </div>

      <button id="generate" class="btn" disabled>⚡ Gerar pacote</button>
    </div>

    <!-- ETAPA 2/3 — PROCESSAR + PACOTE -->
    <div class="panel screen output-panel" id="screen-result" style="display:none;">
      <div class="panel-title">Resultado</div>
      <div id="output"></div>
    </div>

  </div>

  <!-- HISTÓRICO (biblioteca pessoal de pacotes gerados) -->
  <div class="history" id="historyView" style="display:none;">
    <div id="historyList"></div>
    <div id="historyDetail" style="display:none;"></div>
  </div>

</div>

<script>
// Atalho usado em todo o app pra document.getElementById.
const $ = id => document.getElementById(id);

// =================== API CALL (Groq · OpenAI-compatible) ===================
// Modelo único: llama-3.3-70b-versatile (free tier da Groq).
// CHAVE: preencha GROQ_API_KEY abaixo OU deixe em branco e cole quando o app pedir
// (fica salva só neste navegador via localStorage — não acompanha o arquivo .html).
// SEGURANÇA: em uso local/pessoal, a chave no navegador é aceitável. Para publicar o
// app na web, mova esta chamada para um proxy (ex.: Cloudflare Workers / Vercel) e
// NUNCA exponha a chave no HTML público.
const GROQ_API_KEY = "";
function groqModel() { return (window.__AGENTE_CONFIG__ && window.__AGENTE_CONFIG__.groqModel) || localStorage.getItem('groq_model') || "llama-3.3-70b-versatile"; }
const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";

function getGroqKey() {
  let k = ((window.__AGENTE_CONFIG__ && window.__AGENTE_CONFIG__.groqKey) || GROQ_API_KEY || localStorage.getItem('groq_api_key') || '').trim();
  if (!k) {
    k = (window.prompt('Cole sua chave da API Groq (começa com "gsk_"). Pegue em console.groq.com/keys.\nEla fica salva só neste navegador.') || '').trim();
    /* Workspace bloqueado: não persiste em claro nem a digitação manual. */
    if (k && !(window.__AGENTE_CONFIG__ && window.__AGENTE_CONFIG__.locked)) localStorage.setItem('groq_api_key', k);
  }
  return k;
}

async function callLLM(systemPrompt, userPrompt, expectJson = false, maxTokens = 1500) {
  const apiKey = getGroqKey();
  if (!apiKey) throw new Error('Não foi possível iniciar o processamento. Recarregue a página e tente novamente.');

  // REGRA CENTRAL DA APLICAÇÃO: toda e qualquer chamada à IA — independente da
  // funcionalidade ou do modo — recebe primeiro a diretriz de contexto temporal,
  // garantindo conteúdo alinhado ao cenário atual em 100% dos fluxos, sem exceção.
  const systemComContexto = contextoTemporal() + "\n\n" + systemPrompt;

  const body = {
    model: groqModel(),
    max_tokens: maxTokens,
    temperature: expectJson ? 0.4 : 0.8,
    messages: [
      { role: "system", content: systemComContexto },
      { role: "user", content: userPrompt }
    ]
  };
  if (expectJson) body.response_format = { type: "json_object" };

  const MAX_RETRIES = 4;
  for (let attempt = 0; ; attempt++) {
    let response;
    try {
      response = await fetch(GROQ_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify(body)
      });
    } catch (netErr) {
      throw new Error("Falha de conexão. Verifique sua internet e tente novamente.");
    }

    // 429 (limite de taxa) ou 503: respeita Retry-After e tenta de novo com backoff
    if ((response.status === 429 || response.status === 503) && attempt < MAX_RETRIES) {
      const retryAfter = parseFloat(response.headers.get('retry-after'));
      const wait = Number.isFinite(retryAfter) && retryAfter > 0
        ? retryAfter * 1000
        : Math.min(1500 * Math.pow(2, attempt), 20000);
      await new Promise(r => setTimeout(r, wait));
      continue;
    }

    if (!response.ok) {
      const txt = await response.text();
      throw new Error("Não foi possível concluir o processamento agora. Tente novamente em instantes.");
    }

    const data = await response.json();
    const text = ((data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "").trim();
    if (expectJson) {
      const clean = text.replace(/```json|```/g, '').trim();
      try {
        return JSON.parse(clean);
      } catch (e) {
        throw new Error("Tivemos um problema ao montar o pacote. Tente novamente.");
      }
    }
    return text;
  }
}

// Converte o objeto de checklist ({categoria: [opções]}) em texto pra prompt.
// Retorna '' quando nada foi marcado (o checklist é sempre opcional).
function checklistParaTexto(checklist) {
  if (!checklist) return '';
  const blocos = Object.entries(checklist)
    .filter(([, v]) => Array.isArray(v) && v.length)
    .map(([nome, v]) => `- ${nome}: ${v.join(', ')}`);
  return blocos.join('\n');
}

// DIRETRIZ GLOBAL DE CONTEXTO TEMPORAL — esta é a regra central da aplicação.
// É injetada automaticamente em TODA chamada à IA dentro de callLLM (não em funções
// específicas), então VALE PARA TODOS os fluxos e modos sem exceção: criação e análise
// de roteiro, ganchos, estrutura, títulos, legendas, hashtags, palavras-chave, sugestões
// estratégicas e qualquer conteúdo futuro. Calcula ano/mês reais via new Date(), então
// nunca envelhece nem precisa ser editada a cada ano.
function contextoTemporal() {
  const agora = new Date();
  const ano = agora.getFullYear();
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const dataExtenso = `${meses[agora.getMonth()]} de ${ano}`;
  return `==== CONTEXTO TEMPORAL — REGRA GERAL E INEGOCIÁVEL (LEIA PRIMEIRO) ====
A data atual é ${dataExtenso}. Estamos em ${ano}.

O ambiente digital evolui constantemente: plataformas, algoritmos, formatos, linguagem e comportamento de quem assiste mudam de ano para ano. TUDO o que você produzir ou avaliar nesta tarefa — seja roteiro, gancho, estrutura, título, legenda, hashtags, palavras-chave, análise ou sugestão — deve refletir o que funciona AGORA, em ${ano}, no mercado brasileiro de vídeo curto (TikTok, Instagram Reels, YouTube Shorts).

Isso significa, OBRIGATORIAMENTE:
- Usar tendências, formatos e estruturas que estão dando resultado em ${ano} (não em anos anteriores)
- Usar linguagem, gírias e referências contemporâneas, do momento presente
- Refletir os padrões de consumo e o comportamento atual da audiência
- Seguir as boas práticas mais recentes de cada plataforma e de seus algoritmos
- Escolher hashtags e palavras-chave que estão relevantes e buscáveis HOJE — evitar termos saturados, datados ou que já perderam tração
- NÃO reciclar táticas, jargões de marketing ou "fórmulas virais" que faziam sentido no passado mas envelheceram

Na dúvida entre uma abordagem antiga consagrada e uma mais alinhada ao cenário atual, escolha a atual. O resultado tem que parecer feito em ${ano}, por quem acompanha o que está funcionando agora.`;
}

// Regras das ~10 palavras-chave, compartilhadas entre o pacote padrão e o Modo Rápido,
// pra que TODOS os modos entreguem o mesmo modelo de pacote (título + legenda + hashtags + palavras-chave).
const REGRAS_PALAVRAS_CHAVE = `==== REGRAS DAS ~10 PALAVRAS-CHAVE ====
- Devolva de 8 a 12 palavras-chave (idealmente ~10)
- São TERMOS DE BUSCA do tema do vídeo — o que alguém digitaria pra achar esse conteúdo
- Podem ter mais de uma palavra (ex: "economizar no mercado", "lista de compras")
- Em português brasileiro, minúsculas, COM acentuação normal (são palavras-chave, não hashtags)
- Sem "#" e sem repetir as hashtags literalmente
- Variadas: misture termos amplos do tema, termos de nicho e variações que as pessoas realmente buscam
- Relacionadas ao conteúdo (tema/roteiro fornecido); NÃO invente um assunto que não esteja nele
- ATUAIS (ver CONTEXTO TEMPORAL no topo): use os termos como as pessoas REALMENTE buscam hoje, no ano corrente; evite jargões datados ou expressões que caíram em desuso`;

// Regras de hashtags compartilhadas entre o pacote padrão e o Modo Rápido,
// pra que as hashtags saiam SEMPRE com a mesma fórmula (1 ampla · 1 assunto · 2 nicho · 1 intenção).
const REGRAS_HASHTAGS = `==== REGRAS DAS 5 HASHTAGS (fórmula viral brasileira) ====
Você deve devolver EXATAMENTE 5 hashtags, distribuídas assim:

1. UMA hashtag AMPLA / viral: amplo alcance E relevante para a categoria do conteúdo — NÃO use sempre #fyp ou #foryou. Escolha a tag ampla que mais se alinhe com o ASSUNTO do vídeo: para conteúdo de trabalho/carreira → #trabalho, para saúde/bem-estar → #saude, para receitas → #culinaria, para humor/entretenimento geral → #viral, para lifestyle → #parati, para educação → #aprender, para esportes → #esportes, para relacionamentos → #relacionamentos, para empreendedorismo → #negocios, etc. Use #fyp/#foryou APENAS quando o conteúdo for genuinamente de entretenimento geral sem categoria dominante.
2. UMA hashtag de ASSUNTO / categoria: descreve literalmente o tipo de conteúdo, volume médio (ex: #storytime, #relato, #historiareal, #desabafo, #conselho)
3. DUAS hashtags de NICHO: específicas do tema/canal, volume menor mas público qualificado (extraídas do tema/nicho informado e do conteúdo — ex: #historiasdetrabalho, #vidaclt, #rh, #empreendedorismo)
4. UMA hashtag de INTENÇÃO / EMOÇÃO: o que a pessoa SENTE ao assistir ou busca quando procura esse conteúdo (ex: #indignacao, #justicapoetica, #reflexao, #lifelesson, #aprendizado)

REGRAS DAS HASHTAGS:
- Todas em português brasileiro quando aplicável; tags em inglês são aceitas quando genuinamente mais usadas na plataforma para aquele nicho
- Sem espaços, sem acentos, sem caracteres especiais (transformar "ação" em "acao", "história" em "historia")
- Sem # repetido — escreva só uma vez: "fyp" (o app adiciona o # depois)
- Minúsculas
- Evite hashtags de mais de 1 bilhão de views como ÚNICA estratégia — misture amplas com nicho
- Devem ser BUSCÁVEIS: alguém digita aquilo na barra de busca da plataforma
- ATUAIS (ver CONTEXTO TEMPORAL no topo): priorize hashtags relevantes e em alta no ano corrente; evite tags datadas, saturadas ou que já perderam alcance — uma hashtag que bombou anos atrás pode não fazer mais sentido hoje`;

// =================== PACOTE DE PUBLICAÇÃO (LLM-C, call separada) ===================
// Gera título com gancho forte, legenda otimizada, 5 hashtags estratificadas
// e ~10 palavras-chave de SEO — o MESMO pacote completo de todos os modos.
// As práticas seguidas são as do ano corrente (ver contextoTemporal()).
async function gerarPacotePublicacao(roteiroFinal, briefing, feedbackAnterior = null) {
  const sys = `Você é um especialista em SEO e copywriting para plataformas de vídeo curto (TikTok, Instagram Reels, YouTube Shorts) no mercado brasileiro.

Sua tarefa: a partir de um ROTEIRO já pronto e do briefing original, gerar um PACOTE DE PUBLICAÇÃO completo composto de:

1. UM TÍTULO com gancho forte (50–80 caracteres)
2. UMA LEGENDA otimizada (150–300 caracteres no total, hashtags excluídas)
3. CINCO HASHTAGS estratificadas seguindo a fórmula viral brasileira
4. APROXIMADAMENTE 10 PALAVRAS-CHAVE relacionadas ao conteúdo (para SEO e identificação do tema pelos algoritmos)

==== REGRAS DO TÍTULO ====
- Entre 50 e 80 caracteres (ideal para preview sem corte em TikTok/Reels/Shorts)
- Deve abrir LOOP: provocar curiosidade SEM entregar o desfecho da história
- Não usar clickbait barato ("você não vai acreditar"), mas SIM tensão real extraída do conteúdo
- Pode usar: número específico, contradição, pergunta provocadora, frase em 1ª pessoa marcante, revelação parcial
- Em português brasileiro, linguagem de fala natural
- Pode usar até 1 emoji estratégico (opcional, não obrigatório)
- NÃO repetir o gancho do roteiro literalmente — o título é DESCOBERTO pelo espectador antes do vídeo começar

==== REGRAS DA LEGENDA ====

- Os primeiros 80–100 caracteres são CRÍTICOS: aparecem antes do "ver mais". Tem que conter um mini-gancho ou frase de impacto que faça a pessoa parar
- NÃO é resumo do roteiro: a legenda COMPLEMENTA o vídeo, não compete com ele
- Deve incluir UMA pergunta direta ao espectador no final para gerar comentário (regra de ouro do algoritmo: pergunta no caption = +44% de comentários)
- Linguagem natural, primeira pessoa quando fizer sentido
- Pode usar até 2 emojis estratégicos
- Em português brasileiro
- NÃO inclua as hashtags dentro da legenda — elas vão em campo separado

${REGRAS_HASHTAGS}

${REGRAS_PALAVRAS_CHAVE}

==== FORMATO DE RESPOSTA ====
RESPONDA APENAS COM JSON VÁLIDO, sem markdown, sem texto antes ou depois:

{
  "titulo": "string entre 50 e 80 caracteres",
  "legenda": "string entre 150 e 300 caracteres, com pergunta no final",

    {"tag": "HASHTAG_AMPLA", "tipo": "ampla"},

  "palavras_chave": ["palavra um", "termo dois", "..."]
}

Os tipos de hashtag válidos são EXATAMENTE: "ampla", "assunto", "nicho", "intencao".`;

  // Briefing tolerante: no modo "Já tenho um roteiro" não há duração/tom/nicho
  // (o roteiro colado é a única fonte) — essas linhas são omitidas quando vazias.
  const linhasBrief = [`Resumo da história: ${briefing.theme}`];

  const ctxChecklistPkg = checklistParaTexto(briefing.checklist);

  let user = `==== BRIEFING ORIGINAL ====

    const hashtagsAnt = Array.isArray(ant.hashtags) ? ant.hashtags.map(h => '#' + (h.tag || '')).join(' ') : '';
    const kwAnt = Array.isArray(ant.palavras_chave) ? ant.palavras_chave.join(', ') : '';
    user += `\n\n===== REFINAMENTO NECESSÁRIO =====
A versão anterior recebeu nota ${feedbackAnterior.nota_total}/100. Os critérios que falharam:
${(feedbackAnterior.falhas || []).map(f => `- ${f.nome} (nota ${f.score}/10): ${f.feedback}`).join('\n') || '- qualidade geral abaixo do mínimo'}

Pacote anterior (para você MELHORAR, não repetir os erros):
- Título: ${ant.titulo || '(vazio)'}
- Legenda: ${ant.legenda || '(vazio)'}
- Hashtags: ${hashtagsAnt || '(vazias)'}
- Palavras-chave: ${kwAnt || '(vazias)'}

==== INSTRUÇÕES DE CORREÇÃO ====
Gere uma NOVA versão do pacote corrigindo cada problema apontado acima. Mantenha tudo que já estava bom. Continue respeitando TODAS as regras (fórmula das hashtags, faixas de caracteres, ~10 palavras-chave) e baseie-se SOMENTE no roteiro/transcrição fornecido — NÃO invente fatos que não estejam nele. Devolva APENAS o JSON.`;
  }

  return await callLLM(sys, user, true, 1000);
}

// =================== JUIZ DO PACOTE (LLM-D, call separada) ===================
// MESMO mecanismo de controle de qualidade do modo "Criar do zero", agora aplicado ao
// PACOTE de publicação: um avaliador rigoroso pontua cada elemento + a publicação como
// um todo (0-10 por critério), a nota 0-100 é recalculada no código (não confia na
// aritmética da LLM) e o feedback alimenta o refino. As práticas seguidas são as do ano
// corrente — a diretriz de contexto temporal já entra via callLLM, como em todos os fluxos.
const RUBRICA_PACOTE = [
  { id: 'titulo',             nome: 'Título com gancho forte',            desc: 'Abre loop / curiosidade real, 50–80 caracteres, sem clickbait barato, linguagem de fala natural.' },
  { id: 'legenda',            nome: 'Legenda otimizada',                  desc: '150–300 caracteres; os primeiros 80–100 prendem; termina com pergunta que puxa comentário; não embute as hashtags.' },
  { id: 'hashtags',           nome: 'Hashtags estratificadas',            desc: 'Exatamente 5 na fórmula 1 ampla · 1 assunto · 2 nicho · 1 intenção; buscáveis; sem acento/espaço; coerentes com o conteúdo.' },
  { id: 'palavras_chave',     nome: 'Palavras-chave de SEO',              desc: '8–12 termos de busca reais e variados (amplos + nicho), sem repetir as hashtags, ligados ao conteúdo informado.' },
  { id: 'coerencia',          nome: 'Coerência geral da publicação',      desc: 'Título, legenda, hashtags e palavras-chave falam do MESMO conteúdo, sem contradição nem promessa que o vídeo não entrega.' },
  { id: 'engajamento',        nome: 'Potencial de engajamento',           desc: 'O conjunto provoca ação: comentar, compartilhar, salvar ou assistir até o fim.' },
  { id: 'clareza',            nome: 'Clareza da comunicação',             desc: 'Mensagem nítida e sem ambiguidade; em segundos dá pra entender do que é o vídeo.' },
  { id: 'adequacao_objetivo', nome: 'Adequação ao que o usuário pediu',   desc: 'Reflete a descrição livre e as escolhas do checklist (tipo, nicho, emoção, objetivo, plataforma) sem fugir do solicitado nem inventar dados.' },
  { id: 'tendencias',         nome: 'Alinhamento com tendências atuais',  desc: 'Linguagem, formatos, hashtags e termos compatíveis com o que funciona AGORA (ver CONTEXTO TEMPORAL); evita modas saturadas/datadas.' }
];

async function avaliarPacote(pacote, contextoUsuario) {
  const rubricaTexto = RUBRICA_PACOTE.map(r => `- ${r.id}: ${r.nome} — ${r.desc}`).join('\n');
  const hashtagsStr = Array.isArray(pacote.hashtags)
    ? pacote.hashtags.map(h => `#${h.tag} (${h.tipo})`).join('  ')
    : '(vazias)';
  const kwStr = Array.isArray(pacote.palavras_chave) && pacote.palavras_chave.length
    ? pacote.palavras_chave.join(', ')
    : '(vazias)';

  const sys = `Você é um avaliador rigoroso e EXPERIENTE de pacotes de publicação para vídeos curtos (TikTok, Instagram Reels, YouTube Shorts) no mercado brasileiro. Você NUNCA infla notas — sua reputação depende de honestidade brutal. Avalie pelos padrões que funcionam AGORA, não por modas já saturadas.

Você recebe (1) O QUE O USUÁRIO PEDIU (descrição do conteúdo + escolhas de checklist) e (2) O PACOTE gerado (título, legenda, 5 hashtags, ~10 palavras-chave). Avalie cada critério da rubrica com nota de 0 a 10:
- 0-3: falha grave
- 4-6: deficiente, precisa melhorar
- 7-8: aceitável
- 9-10: excelente

Para cada critério dê: score (0-10) e feedback objetivo (1-2 frases), apontando o problema específico ou validando o acerto. No critério "adequacao_objetivo", verifique se o pacote NÃO inventa fatos que o usuário não informou e se respeita o objetivo/plataforma escolhidos.

RUBRICA COMPLETA:
${rubricaTexto}

RESPONDA APENAS COM JSON VÁLIDO no formato:
{
  "avaliacoes": [
    {"id": "titulo", "score": 8, "feedback": "..."},
    {"id": "legenda", "score": 7, "feedback": "..."},
    ...
  ],
  "nota_total": 82,
  "veredito": "string curta de 1 frase sobre o pacote como um todo"
}

A nota_total é (soma dos scores / total possível) * 100. Use cálculo correto.`;

  const user = `==== O QUE O USUÁRIO PEDIU ====
${contextoUsuario}

==== PACOTE A SER AVALIADO ====
Título: ${pacote.titulo || '(vazio)'}
Legenda: ${pacote.legenda || '(vazio)'}
Hashtags: ${hashtagsStr}
Palavras-chave: ${kwStr}

Avalie cada critério da rubrica agora. Seja honesto e rigoroso. Devolva APENAS o JSON.`;

  const resultado = await callLLM(sys, user, true, 1500);
  // Recalcula a nota a partir dos scores devolvidos, sem depender da aritmética da LLM
  if (resultado && Array.isArray(resultado.avaliacoes) && resultado.avaliacoes.length) {
    const soma = resultado.avaliacoes.reduce((acc, a) => acc + (Number(a.score) || 0), 0);
    const max = resultado.avaliacoes.length * 10;
    resultado.nota_total = Math.round((soma / max) * 100);
  }
  return resultado;
}

// =================== UI HELPERS ===================
function scoreClass(score) {
  if (score >= 80) return 'pass';
  if (score >= 60) return 'warn';
  return 'fail';
}
function critClass(score) {
  if (score >= 7) return 'pass';
  if (score >= 5) return 'warn';
  return 'fail';
}

function formatRoteiro(texto) {
  // Procura tags [GANCHO], [DESENVOLVIMENTO], etc.
  const segments = texto.split(/\[([A-ZÇÃÕÉÊÍÓÚ\s]+)\]/g).filter(s => s.trim());
  if (segments.length < 2) {
    return `<div>${escapeHtml(texto).replace(/\n/g, '<br>')}</div>`;
  }
  let html = '';
  for (let i = 0; i < segments.length; i += 2) {
    const label = segments[i].trim();
    const content = (segments[i+1] || '').trim();
    if (content) {
      html += `<span class="seg"><span class="seg-label">${escapeHtml(label)}</span>${escapeHtml(content).replace(/\n/g, '<br>')}</span>`;
    }
  }
  return html;
}

function renderPipeline(steps) {
  return `<div class="pipeline">${steps.map(s => `
    <div class="pipeline-step ${s.state}">
      <div class="dot"></div>
      <div>
        <div class="label">${escapeHtml(s.label)}</div>
        ${s.desc ? `<div class="desc">${escapeHtml(s.desc)}</div>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Event delegation pra botões dinâmicos (copiar · alternar avaliação · recomeçar)
document.addEventListener('click', (e) => {
  // Recomeçar o assistente (↺ Transcrever outro arquivo / ← Voltar)
  const resetBtn = e.target.closest('[data-wizard-reset]');
  if (resetBtn) {
    resetWizard();
    return;
  }

  // Navegação entre abas (Nova transcrição / Histórico)
  const viewBtn = e.target.closest('[data-view]');
  if (viewBtn) { setView(viewBtn.dataset.view); return; }

  // Excluir item — checado ANTES de abrir (o 🗑 fica dentro do card data-open-id)
  const delBtn = e.target.closest('[data-del-id]');
  if (delBtn) { excluirHistorico(delBtn.dataset.delId); return; }

  // Abrir um item do histórico
  const openBtn = e.target.closest('[data-open-id]');
  if (openBtn) { abrirHistorico(openBtn.dataset.openId); return; }

  // Voltar à lista do histórico
  if (e.target.closest('[data-hist-back]')) { voltarHistorico(); return; }

  // Editar o pacote (campos viram caixas)
  const editBtn = e.target.closest('[data-edit-id]');
  if (editBtn) {
    const card = editBtn.closest('.pkgcard');
    if (card) card.innerHTML = renderPacoteCardInner(histGet(editBtn.dataset.editId), true);
    return;
  }
  // Salvar a edição (persiste e substitui a versão anterior) — escopo no card clicado
  const saveBtn = e.target.closest('[data-save-id]');
  if (saveBtn) { salvarEdicao(saveBtn.dataset.saveId, saveBtn.closest('.pkgcard')); return; }
  // Cancelar a edição (volta ao modo exibição sem salvar)
  const cancelBtn = e.target.closest('[data-cancel-id]');
  if (cancelBtn) {
    const card = cancelBtn.closest('.pkgcard');
    if (card) card.innerHTML = renderPacoteCardInner(histGet(cancelBtn.dataset.cancelId), false);
    return;
  }

  // Avaliar potencial da transcrição (ou reanalisar). O botão fica no cabeçalho da transcrição
  // (fora do .analisecard) OU dentro do card (reanalisar/tentar de novo) — acha o card nos 2 casos.
  const analyzeBtn = e.target.closest('[data-analyze-id]');
  if (analyzeBtn) {
    let cardEl = analyzeBtn.closest('.analisecard');
    if (!cardEl) { const wrap = analyzeBtn.closest('.transc-wrap'); if (wrap) cardEl = wrap.querySelector('.analisecard'); }
    analisarConteudoUI(analyzeBtn.dataset.analyzeId, cardEl);
    return;
  }

  const copyBtn = e.target.closest('[data-copy-id]');
  if (copyBtn) {
    const id = copyBtn.dataset.copyId;
    const text = (window._roteiroRegistry || {})[id];
    if (!text) return;

    const showFeedback = (msg, color) => {
      const orig = copyBtn.textContent;
      copyBtn.textContent = msg;
      copyBtn.style.color = color;
      setTimeout(() => { copyBtn.textContent = orig; copyBtn.style.color = ''; }, 1800);
    };

    // Tenta clipboard API moderna primeiro
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(() => showFeedback('Copiado ✓', 'var(--pass)'))
        .catch(() => fallbackCopy(text, showFeedback));
    } else {
      fallbackCopy(text, showFeedback);
    }
    return;
  }

  const evalBtn = e.target.closest('[data-eval-id]');
  if (evalBtn) {
    const el = document.getElementById(evalBtn.dataset.evalId);
    if (el) {
      const colapsado = el.classList.toggle('eval-collapsed');
      evalBtn.textContent = colapsado ? 'Avaliação ▾' : 'Avaliação ▴';
    }
  }
});

function fallbackCopy(text, showFeedback) {
  // Fallback usando textarea temporário pra ambientes sem clipboard API
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    const ok = document.execCommand('copy');
    showFeedback(ok ? 'Copiado ✓' : 'Erro ✗', ok ? 'var(--pass)' : 'var(--fail)');
  } catch (err) {
    showFeedback('Erro ✗', 'var(--fail)');
  }
  document.body.removeChild(ta);
}

// =================== RENDERIZA PACOTE DE PUBLICAÇÃO ===================
const TIPO_LABEL = {
  'ampla':    'Ampla',
  'assunto':  'Assunto',
  'nicho':    'Nicho',
  'intencao': 'Intenção'
};

function sanitizeHashtag(tag) {
  // Remove # do começo se vier, espaços, e força minúsculas
  return String(tag || '')
    .replace(/^#+/, '')
    .replace(/\s+/g, '')
    .toLowerCase();
}

// Banner + avaliação detalhada (colapsável) do juiz do pacote — mesma linguagem visual
// do veredito do modo "Criar do zero" (final-banner + eval-box + critérios).
function renderAvaliacaoPacote(avaliacao, aprovado) {
  const cls = scoreClass(avaliacao.nota_total);
  const evalId = 'evalpkg-' + Math.random().toString(36).slice(2);
  const critsHtml = (avaliacao.avaliacoes || []).map(a => {
    const rub = RUBRICA_PACOTE.find(r => r.id === a.id);
    return `<div class="criterion">
      <div class="crit-score ${critClass(a.score)}">${a.score}/10</div>
      <div class="crit-body">
        <div class="crit-name">${rub ? rub.nome : a.id}</div>
        <div class="crit-feedback">${escapeHtml(a.feedback || '')}</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="final-banner ${aprovado ? '' : 'warn'}">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:14px;">
      <div>
        <div class="final-label">${aprovado ? '✓ Pacote aprovado na revisão' : '⚠ Melhor versão obtida'}</div>
        <div class="final-text">${escapeHtml(avaliacao.veredito || '')}</div>
      </div>
      <div style="display:flex; gap:12px; align-items:center; flex-shrink:0;">
        <span class="iter-score ${cls}">${avaliacao.nota_total}<span class="max">/100</span></span>
        <button class="toggle-eval" data-eval-id="${evalId}">Avaliação ▾</button>
      </div>
    </div>
    <div class="eval-box eval-collapsed" id="${evalId}" style="margin-top:16px;">
      ${critsHtml}
    </div>
  </div>`;
}

function renderPacote(pacote, opts) {
  opts = opts || {};
  // Sanitiza e valida
  const titulo = String(pacote.titulo || '').trim();
  const legenda = String(pacote.legenda || '').trim();
  // Tolera hashtags como [{tag,tipo}] (geração) OU [string] (após edição manual).
  const hashtags = (Array.isArray(pacote.hashtags) ? pacote.hashtags : []).map(h =>
    (typeof h === 'string') ? { tag: h, tipo: '' } : { tag: (h && h.tag) || '', tipo: (h && h.tipo) || '' });
  const palavrasChave = Array.isArray(pacote.palavras_chave)
    ? pacote.palavras_chave.map(k => String(k || '').trim()).filter(Boolean)
    : [];

  const tituloLen = titulo.length;
  const legendaLen = legenda.length;

  // Constrói a string de hashtags pronta pra colar
  const hashtagsString = hashtags
    .map(h => '#' + sanitizeHashtag(h.tag))
    .join(' ');

  // Distribuição real das hashtags por tipo (reflete o que a LLM devolveu)
  const distHashtags = hashtags.reduce((acc, h) => {
    if (acc[h.tipo] !== undefined) acc[h.tipo]++;
    return acc;
  }, { ampla: 0, assunto: 0, nicho: 0, intencao: 0 });
  const temTipos = hashtags.some(h => h.tipo);
  const distLabel = temTipos
    ? `${distHashtags.ampla} ampla · ${distHashtags.assunto} assunto · ${distHashtags.nicho} nicho · ${distHashtags.intencao} intenção`
    : `${hashtags.length} hashtag${hashtags.length === 1 ? '' : 's'}`;

  // String de palavras-chave pronta pra colar (separadas por vírgula)
  const keywordsString = palavrasChave.join(', ');

  // Constrói o "copiar tudo"
  const copyAllText = `${titulo}\n\n${legenda}\n\n${hashtagsString}` +
    (palavrasChave.length ? `\n\n${keywordsString}` : '');

  // Registra os textos no registry global pra evitar problemas de escape inline
  const pkgId = 'pkg-' + Math.random().toString(36).slice(2);
  window._roteiroRegistry = window._roteiroRegistry || {};
  window._roteiroRegistry[pkgId + '-titulo'] = titulo;
  window._roteiroRegistry[pkgId + '-legenda'] = legenda;
  window._roteiroRegistry[pkgId + '-hashtags'] = hashtagsString;
  window._roteiroRegistry[pkgId + '-keywords'] = keywordsString;
  window._roteiroRegistry[pkgId + '-all'] = copyAllText;

  const chipsHtml = hashtags.map(h => {
    const tagClean = sanitizeHashtag(h.tag);
    const tipoLabel = TIPO_LABEL[h.tipo] || h.tipo || '';
    return `<span class="hashtag-chip">
      ${tipoLabel ? `<span class="tag-type">${escapeHtml(tipoLabel)}</span>` : ''}
      #${escapeHtml(tagClean)}
    </span>`;
  }).join('');

  // Indicadores de tamanho (verde se dentro do range ideal)
  const tituloDentro = tituloLen >= 50 && tituloLen <= 80;
  const legendaDentro = legendaLen >= 150 && legendaLen <= 300;
  const tituloColor = tituloDentro ? 'var(--pass)' : 'var(--warn)';
  const legendaColor = legendaDentro ? 'var(--pass)' : 'var(--warn)';

  // Seção de palavras-chave (só aparece quando a LLM devolveu — modo rápido)
  const keywordChipsHtml = palavrasChave
    .map(k => `<span class="keyword-chip">${escapeHtml(k)}</span>`)
    .join('');
  const keywordsSection = palavrasChave.length ? `
    <div class="pkg-section">
      <div class="pkg-label">
        <span class="pkg-label-text">Palavras-chave</span>
        <button class="copy-btn" data-copy-id="${pkgId}-keywords">Copiar</button>
      </div>
      <div class="keywords-grid">${keywordChipsHtml}</div>
      <div class="keywords-string">${escapeHtml(keywordsString)}</div>
    </div>` : '';

  return `<div class="package">
    <div class="package-header">
      <div class="package-title">⚡ Pacote de Publicação</div>
      <div style="display:flex; gap:8px; align-items:center;">
        ${opts.editId ? `<button class="copy-btn" data-edit-id="${opts.editId}">✏️ Editar</button>` : ''}
        <button class="copy-all-btn" data-copy-id="${pkgId}-all">Copiar tudo</button>
      </div>
    </div>

    <div class="pkg-section">
      <div class="pkg-label">
        <span class="pkg-label-text">Título</span>
        <span style="display:flex; gap:10px; align-items:center;">
          <span class="pkg-meta" style="color:${tituloColor};">${tituloLen}/80 caracteres</span>
          <button class="copy-btn" data-copy-id="${pkgId}-titulo">Copiar</button>
        </span>
      </div>
      <div class="pkg-content titulo">${escapeHtml(titulo)}</div>
    </div>

    <div class="pkg-section">
      <div class="pkg-label">
        <span class="pkg-label-text">Legenda</span>
        <span style="display:flex; gap:10px; align-items:center;">
          <span class="pkg-meta" style="color:${legendaColor};">${legendaLen} caracteres (ideal 150–300)</span>
          <button class="copy-btn" data-copy-id="${pkgId}-legenda">Copiar</button>
        </span>
      </div>
      <div class="pkg-content legenda">${escapeHtml(legenda)}</div>
    </div>

    <div class="pkg-section">
      <div class="pkg-label">
        <span class="pkg-label-text">Hashtags</span>
        <span style="display:flex; gap:10px; align-items:center;">
          <span class="pkg-meta">${distLabel}</span>
          <button class="copy-btn" data-copy-id="${pkgId}-hashtags">Copiar</button>
        </span>
      </div>
      <div class="hashtags-grid">${chipsHtml}</div>
      <div class="hashtags-string">${escapeHtml(hashtagsString)}</div>
    </div>
${keywordsSection}
  </div>`;
}

// =================== HISTÓRICO (biblioteca pessoal, localStorage) ===================
const HIST_KEY = 'rv_historico';        // chave legada (localStorage) — migrada p/ IDB
const HIST_IDB_KEY = 'hist:autopost';   // histórico no IndexedDB (limite = dispositivo)

/* ============================================================
   HISTÓRICO NO INDEXEDDB — capacidade = DISPOSITIVO (não os ~5 MB do localStorage)
   Mesmo store do app pai ('agente-store'/'kv'): em http (mesma origem) o backup
   da plataforma já inclui este histórico automaticamente. O array fica em memória
   (_histCache) como fonte SÍNCRONA do render; a gravação no IDB é assíncrona.
   histHydrate() carrega no boot e migra o rv_historico antigo uma única vez.
   ============================================================ */
function _apIdbOpen() { return new Promise((res, rej) => { try { const r = indexedDB.open('agente-store', 1); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
function _apIdbGet(k) { return _apIdbOpen().then((db) => new Promise((res, rej) => { const tx = db.transaction('kv', 'readonly'); const rq = tx.objectStore('kv').get(k); rq.onsuccess = () => { db.close(); res(rq.result); }; rq.onerror = () => { db.close(); rej(rq.error); }; })); }
function _apIdbSet(k, v) { return _apIdbOpen().then((db) => new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => { db.close(); res(true); }; tx.onerror = () => { db.close(); rej(tx.error); }; })); }

let _histCache = null;                   // array em memória (fonte síncrona do render)

function histLoad() {
  if (Array.isArray(_histCache)) return _histCache;
  // Antes da hidratação assíncrona: lê do localStorage (compat) sem quebrar o render.
  try {
    const raw = localStorage.getItem(HIST_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (_) { return []; }
}
function histSaveAll(arr) {
  _histCache = Array.isArray(arr) ? arr : [];
  if (typeof indexedDB !== 'undefined') {
    // Persiste no IndexedDB; só avisa em caso de cota REAL do dispositivo.
    _apIdbSet(HIST_IDB_KEY, _histCache)
      .then(() => { try { localStorage.removeItem(HIST_KEY); } catch (_) { /* */ } })
      .catch(() => alert('Não foi possível salvar no histórico (o armazenamento do dispositivo encheu). Exclua itens antigos e tente de novo.'));
    return true;
  }
  // Sem IndexedDB (raro): modo degradado no localStorage.
  try { localStorage.setItem(HIST_KEY, JSON.stringify(_histCache)); return true; }
  catch (e) { alert('Não foi possível salvar no histórico (o armazenamento do navegador encheu). Exclua itens antigos e tente de novo.'); return false; }
}

// Boot: carrega o histórico do IndexedDB (migra do localStorage antigo 1x) e
// atualiza a interface. O render síncrono usa o cache em memória.
async function histHydrate() {
  if (typeof indexedDB === 'undefined') return;
  try {
    let arr = await _apIdbGet(HIST_IDB_KEY);
    if (!Array.isArray(arr)) {
      let legacy = [];
      try { const raw = localStorage.getItem(HIST_KEY); legacy = raw ? JSON.parse(raw) : []; } catch (_) { legacy = []; }
      arr = Array.isArray(legacy) ? legacy : [];
      // Só grava a migração se ninguém salvou durante a hidratação (evita clobber).
      if (_histCache === null && arr.length) { try { await _apIdbSet(HIST_IDB_KEY, arr); } catch (_) { /* */ } }
    }
    // Não sobrescreve o cache se um save já ocorreu na janela de hidratação.
    if (_histCache === null) {
      _histCache = arr;
      try { localStorage.removeItem(HIST_KEY); } catch (_) { /* */ }
    }
    try { updateHistBadge(); } catch (_) { /* */ }
    try { const hv = document.querySelector('#historyView'); if (hv && hv.style.display !== 'none') voltarHistorico(); } catch (_) { /* */ }
  } catch (_) { /* mantém fallback do localStorage */ }
}
function histCount() { return histLoad().length; }
function histGet(id) { return histLoad().find(it => it.id === id) || null; }
function histAdd(item) {
  const arr = histLoad();
  arr.push(item);
  histSaveAll(arr);
  return item.id;
}
function histUpdate(id, patch) {
  const arr = histLoad();
  const i = arr.findIndex(it => it.id === id);
  if (i < 0) return false;
  arr[i] = Object.assign({}, arr[i], patch);
  return histSaveAll(arr);
}
function histDelete(id) {
  return histSaveAll(histLoad().filter(it => it.id !== id));
}

function updateHistBadge() {
  const b = $('histBadge');
  if (b) b.textContent = histCount();
}

// Alterna entre a tela do assistente e o histórico.
function setView(view) {
  document.querySelectorAll('#tabs .tab').forEach(t =>

  const wiz = document.querySelector('.wizard');

  if (wiz) wiz.style.display = (view === 'history') ? 'none' : '';
  if (hist) hist.style.display = (view === 'history') ? '' : 'none';

}

// Data/hora legível em pt-BR.
function fmtData(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  } catch (_) { return ''; }
}

// =================== ANÁLISE DE POTENCIAL (opcional, sob demanda) ===================
// Reaproveita a mecânica do Detector Flop (avaliar o potencial do conteúdo), mas usando a
// infra do próprio AutoPost IA (callLLM) e o visual de score já existente. 100% opcional;
// não toca no fluxo principal. O resultado é salvo no item (persiste no histórico).
const ANALISE_DIMENSOES = [
  { id: 'gancho',           nome: 'Gancho' },
  { id: 'retencao',         nome: 'Retenção' },
  { id: 'clareza',          nome: 'Clareza da mensagem' },
  { id: 'interesse',        nome: 'Nível de interesse' },
  { id: 'compartilhamento', nome: 'Compartilhamento' },
  { id: 'engajamento',      nome: 'Engajamento' }
];

async function analisarConteudo(transcricao) {
  const texto = String(transcricao || '').trim();
  if (texto.length < 20) throw new Error('Conteúdo curto demais para analisar.');

  const sistema = 'Você é um analista sênior de conteúdo para redes sociais no Brasil. A partir da transcrição/texto de um conteúdo, avalie de forma realista e útil o POTENCIAL de desempenho dele. Baseie-se SOMENTE no que está no texto — não invente fatos. Seja específico e direto. Responda APENAS com JSON válido, sem markdown.';

  const usuario = `Analise o conteúdo abaixo e devolva EXATAMENTE este JSON:
{
  "nota_geral": <inteiro 0-100, probabilidade de bom desempenho>,
  "classificacao": "ALTO" | "MÉDIO" | "BAIXO",
  "veredito": "<frase curta de 6 a 12 palavras resumindo o potencial>",
  "dimensoes": [
    { "id": "gancho", "score": <0-10>, "comentario": "<1 frase>" },
    { "id": "retencao", "score": <0-10>, "comentario": "<1 frase>" },
    { "id": "clareza", "score": <0-10>, "comentario": "<1 frase>" },
    { "id": "interesse", "score": <0-10>, "comentario": "<1 frase>" },
    { "id": "compartilhamento", "score": <0-10>, "comentario": "<1 frase>" },
    { "id": "engajamento", "score": <0-10>, "comentario": "<1 frase>" }
  ],
  "pontos_fortes": ["<frase>", "..."],
  "pontos_fracos": ["<frase>", "..."],
  "sugestoes": ["<sugestão prática>", "..."]
}
Use exatamente esses 6 id de dimensão. Cada lista deve ter de 2 a 4 itens curtos e acionáveis.

CONTEÚDO:
"""
${texto}
"""`;

  const json = await callLLM(sistema, usuario, true, 1400);
  return normalizarAnalise(json);
}

function normalizarAnalise(json) {
  json = json || {};
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, Math.round(Number(n) || 0)));
  const nota = clamp(json.nota_geral, 0, 100);
  let clas = String(json.classificacao || '').toUpperCase();
  if (clas === 'MEDIO') clas = 'MÉDIO';
  if (!['ALTO', 'MÉDIO', 'BAIXO'].includes(clas)) clas = nota >= 70 ? 'ALTO' : nota >= 45 ? 'MÉDIO' : 'BAIXO';
  const dimIn = Array.isArray(json.dimensoes) ? json.dimensoes : [];
  const dimensoes = ANALISE_DIMENSOES.map(def => {
    const achou = dimIn.find(d => d && String(d.id) === def.id) || {};
    return { id: def.id, nome: def.nome, score: clamp(achou.score, 0, 10), comentario: String(achou.comentario || '').trim() };
  });
  const lista = (v) => (Array.isArray(v) ? v.map(s => String(s || '').trim()).filter(Boolean).slice(0, 4) : []);
  return {
    nota_geral: nota,
    classificacao: clas,
    veredito: String(json.veredito || '').trim(),
    dimensoes: dimensoes,
    pontos_fortes: lista(json.pontos_fortes),
    pontos_fracos: lista(json.pontos_fracos),
    sugestoes: lista(json.sugestoes)
  };
}

// Seção da análise no detalhe: o botão (se ainda não analisou) OU os resultados.
function renderAnaliseSecao(item) {
  // O disparo fica no cabeçalho da transcrição (data-analyze-id). Este card só guarda os
  // resultados: vazio até o usuário avaliar; preenchido (e persistido) depois.
  const inner = item.analise ? renderAnaliseInner(item.analise, item.id) : '';
  return `<div class="analisecard">${inner}</div>`;
}

function renderAnaliseInner(an, id) {
  const cls = scoreClass(an.nota_geral);
  const clasLabel = an.classificacao === 'ALTO' ? 'Alto potencial'
    : an.classificacao === 'BAIXO' ? 'Baixo potencial' : 'Potencial médio';
  const dims = (an.dimensoes || []).map(d => `
    <div class="criterion">
      <div class="crit-score ${critClass(d.score)}">${d.score}/10</div>
      <div class="crit-body">
        <div class="crit-name">${escapeHtml(d.nome)}</div>
        <div class="crit-feedback">${escapeHtml(d.comentario || '')}</div>
      </div>
    </div>`).join('');
  const bloco = (titulo, itens, marc) => (itens && itens.length) ? `
    <div class="analise-bloco">
      <div class="analise-bloco-tit">${titulo}</div>
      <ul class="analise-lista">${itens.map(i => `<li><span class="am">${marc}</span><span>${escapeHtml(i)}</span></li>`).join('')}</ul>
    </div>` : '';
  return `<div class="final-banner ${cls === 'fail' ? 'warn' : ''}">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:14px;">
      <div>
        <div class="final-label">🔍 Análise de potencial · ${escapeHtml(clasLabel)}</div>
        <div class="final-text">${escapeHtml(an.veredito || '')}</div>
      </div>
      <span class="iter-score ${cls}" style="flex-shrink:0;">${an.nota_geral}<span class="max">/100</span></span>
    </div>
    <div style="margin-top:16px;">
      ${dims}
      ${bloco('Pontos fortes', an.pontos_fortes, '✓')}
      ${bloco('Pontos a melhorar', an.pontos_fracos, '⚠')}
      ${bloco('Sugestões', an.sugestoes, '→')}
      <div style="margin-top:16px;"><button type="button" class="btn-analise btn-analise-sm" data-analyze-id="${id}">↻ Analisar de novo</button></div>
    </div>
  </div>`;
}

// Dispara a análise (ou reanálise) e re-renderiza SÓ o card da análise (escopo via closest).
async function analisarConteudoUI(id, cardEl) {
  const item = histGet(id);
  if (!item || !cardEl) return;
  if (cardEl.dataset.loading === '1') return; // evita reentrância (cliques repetidos no botão do cabeçalho)
  cardEl.dataset.loading = '1';
  cardEl.innerHTML = `<div class="analise-loading">Analisando o potencial do conteúdo…</div>`;
  try {
    const analise = await analisarConteudo(item.transcricao);
    histUpdate(id, { analise: analise });
    cardEl.innerHTML = renderAnaliseInner(analise, id);
  } catch (err) {
    cardEl.innerHTML = `<div class="error-box" style="margin:0;">
        <strong>Não foi possível analisar</strong>
        ${escapeHtml((err && err.message) || 'Tente novamente.')}
      </div>
      <div style="margin-top:12px;"><button type="button" class="btn-analise" data-analyze-id="${id}">↻ Tentar de novo</button></div>`;
  } finally {
    cardEl.dataset.loading = '';
  }
}

// Lê as caixas de edição, normaliza e persiste (a versão editada SUBSTITUI a anterior).
function salvarEdicao(id, cardEl) {
  const item = histGet(id);
  if (!item) return;
  const scope = cardEl || document;
  const val = (sel) => { const el = scope.querySelector(sel); return el ? el.value : ''; };
  const titulo = val('[data-ed="titulo"]').trim();
  const legenda = val('[data-ed="legenda"]').trim();
  const prev = Array.isArray(item.pacote && item.pacote.hashtags) ? item.pacote.hashtags : [];
  const tags = val('[data-ed="hashtags"]').split(/[\s,]+/).map(t => sanitizeHashtag(t)).filter(Boolean);
  const hashtags = tags.map((tag, i) => ({ tag, tipo: (prev[i] && prev[i].tipo) || '' }));
  const palavras_chave = val('[data-ed="keywords"]').split(',').map(k => k.trim()).filter(Boolean);
  histUpdate(id, { pacote: { titulo, legenda, hashtags, palavras_chave }, editado: true, atualizadoEm: new Date().toISOString() });
  if (cardEl) cardEl.innerHTML = renderPacoteCardInner(histGet(id), false);
}
